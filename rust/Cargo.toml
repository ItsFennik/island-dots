[package]
name = "island-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
anyhow = "1"
async-channel = "2"
gio-unix = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.9"
meval = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[[bin]]
name = "island-spotlight"
path = "src/bin/island-spotlight.rs"

[[bin]]
name = "island-settings"
path = "src/bin/island-settings.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
