# Island on Sway / SwayFX / Scroll: add to ~/.config/sway/config.

# Generated by Island Settings / themes:
include island.conf          # gaps, borders, input, cursor
include island-theme.conf    # border colours

exec ~/.config/quickshell/island/scripts/wallpaper-set.sh --restore
exec qs -c island -n -d
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

set $island qs -c island ipc call
bindsym $mod+d          exec $island launcher toggle
bindsym $mod+a          exec $island launchpad toggle
bindsym $mod+c          exec $island menu notifs
bindsym $mod+v          exec $island menu clipboard
bindsym $mod+m          exec $island media toggle
bindsym $mod+i          exec $island settings toggle
bindsym $mod+w          exec $island picker wallpapers
bindsym $mod+Mod1+w     exec $island picker themes
bindsym $mod+Escape     exec $island menu power
bindsym $mod+Ctrl+q     exec $island lock lock

bindsym --locked XF86AudioRaiseVolume exec $island volume up
bindsym --locked XF86AudioLowerVolume exec $island volume down
bindsym --locked XF86AudioMute        exec $island volume mute
bindsym --locked XF86AudioPlay        exec $island media playPause
bindsym --locked XF86AudioNext        exec $island media next
bindsym --locked XF86AudioPrev        exec $island media previous

# SwayFX only: frosted bar, dock and widgets.
# layer_effects "island-bar" blur enable
# layer_effects "island-dock" blur enable
# layer_effects "island-widgets" blur enable
