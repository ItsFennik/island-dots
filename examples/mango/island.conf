# Island on MangoWC: add to ~/.config/mango/config.conf.

# Session dirs, dbus, PipeWire on non-systemd, clipboard, wallpaper and Quickshell.
exec-once=~/.config/quickshell/island/scripts/island-startup

bind=SUPER,d,spawn,~/.config/quickshell/island/scripts/island-shortcut launcher
bind=SUPER,a,spawn,~/.config/quickshell/island/scripts/island-shortcut launchpad
bind=SUPER,c,spawn,~/.config/quickshell/island/scripts/island-shortcut notifs
bind=SUPER,v,spawn,~/.config/quickshell/island/scripts/island-shortcut clipboard
bind=SUPER,m,spawn,~/.config/quickshell/island/scripts/island-shortcut media
bind=SUPER,i,spawn,~/.config/quickshell/island/scripts/island-shortcut settings
bind=SUPER,w,spawn,~/.config/quickshell/island/scripts/island-shortcut wallpaper
bind=SUPER+ALT,w,spawn,~/.config/quickshell/island/scripts/island-shortcut theme
bind=SUPER,Escape,spawn,~/.config/quickshell/island/scripts/island-shortcut power
bind=SUPER+CTRL,q,spawn,~/.config/quickshell/island/scripts/island-shortcut lock

bind=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/island/scripts/island-shortcut volumeUp
bind=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/island/scripts/island-shortcut volumeDown
bind=NONE,XF86AudioMute,spawn,~/.config/quickshell/island/scripts/island-shortcut volumeMute
bind=NONE,XF86AudioPlay,spawn,~/.config/quickshell/island/scripts/island-shortcut mediaPlayPause
bind=NONE,XF86AudioNext,spawn,~/.config/quickshell/island/scripts/island-shortcut mediaNext
bind=NONE,XF86AudioPrev,spawn,~/.config/quickshell/island/scripts/island-shortcut mediaPrevious

# Island / notch skins: menus and Spotlight grow out of the capsule in Qt, so no compositor fade on top.
layer_rule=layer_name:island-capsule-menu,no_blur:1,no_animation:1,no_shadow:1
layer_rule=layer_name:island-capsule-spotlight,no_blur:1,no_animation:1,no_shadow:1
