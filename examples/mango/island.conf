# Island on MangoWC: add to ~/.config/mango/config.conf.

exec-once=~/.config/quickshell/island/scripts/wallpaper-set.sh --restore
exec-once=qs -c island -n -d
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

bind=SUPER,d,spawn,qs -c island ipc call launcher toggle
bind=SUPER,a,spawn,qs -c island ipc call launchpad toggle
bind=SUPER,c,spawn,qs -c island ipc call menu notifs
bind=SUPER,v,spawn,qs -c island ipc call menu clipboard
bind=SUPER,m,spawn,qs -c island ipc call media toggle
bind=SUPER,i,spawn,qs -c island ipc call settings toggle
bind=SUPER,w,spawn,qs -c island ipc call picker wallpapers
bind=SUPER+ALT,w,spawn,qs -c island ipc call picker themes
bind=SUPER,Escape,spawn,qs -c island ipc call menu power
bind=SUPER+CTRL,q,spawn,qs -c island ipc call lock lock

bind=NONE,XF86AudioRaiseVolume,spawn,qs -c island ipc call volume up
bind=NONE,XF86AudioLowerVolume,spawn,qs -c island ipc call volume down
bind=NONE,XF86AudioMute,spawn,qs -c island ipc call volume mute
bind=NONE,XF86AudioPlay,spawn,qs -c island ipc call media playPause
bind=NONE,XF86AudioNext,spawn,qs -c island ipc call media next
bind=NONE,XF86AudioPrev,spawn,qs -c island ipc call media previous
